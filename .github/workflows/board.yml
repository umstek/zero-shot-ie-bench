name: board
# docs/plan/03: build lake → build board → deploy Pages. Manual until the
# board is real; the deploy step is standard Pages and inert until enabled
# in repo settings.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/board/**"
      - "packages/**"
      - "bench/src/render/**"
      - "runs/**"
      - "catalog/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lake
      - run: bun run --cwd apps/board build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/board/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
