name: board
# Manual build artifact check for the unified static site (hosted on Cloudflare).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build:site
      - uses: actions/upload-artifact@v7
        with:
          name: dist-site
          path: dist-site
