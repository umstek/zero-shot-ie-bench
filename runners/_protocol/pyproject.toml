[project]
name = "runner-protocol"
version = "0.1.0"
description = "Shared library for runner islands: FastAPI app factory, /info + /healthz, /v1/<track> wire models (generated from catalog/schema), host fingerprint, Gradio mount."
readme = "README.md"
# >=3.11, not >=3.13: the relik island runs Python 3.11 (relik 1.0.7 pins
# torch==2.3.1, which has no 3.13 wheels) and takes this package as a path
# dependency, so the declared floor must admit it. The CODE is
# 3.11-compatible (from __future__ import annotations everywhere, no PEP
# 695 syntax); this project's own venv/tests stay on 3.13 (.python-version).
requires-python = ">=3.11"
dependencies = [
    # Floors at the current majors at install time (docs/plan/02 - version floors).
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "pydantic>=2.14",
]

[project.optional-dependencies]
# Gradio needs huggingface-hub>=1.16, which conflicts with the
# transformers-4.57.x islands' hub<1.0 pin — so the UI mount is an extra;
# islands that mount a UI depend on runner-protocol[ui].
ui = ["gradio>=6.30"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "pyrefly>=1.4",
    "datamodel-code-generator>=0.86",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runner_protocol"]

[tool.uv]
required-version = ">=0.13"

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"
