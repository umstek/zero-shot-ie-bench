[project]
name = "nanodiff-runner"
version = "0.1.0"
description = "Local runner island for the nanodiff 350M diffusion decision engine: the vendored BY571/nanoDiff bidirectional transformer + the pngwn typed-decisions format, serving both checkpoints (lam1 v1 and the v2 retrain) on the torch main-env CPU stack."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # --- the engine stack (what legacy/engines/nanodiff_engine imports) ---
    # The engine ran in the MAIN venv (legacy/requirements.txt has no torch
    # line — it resolved transitively; .venv carries torch 2.14.0 and ran
    # the nanodiff benches). Current-major floor like the von island,
    # exact version comes from the lock. The CPU index keeps Linux/docker
    # off the CUDA wheels (this deployment is CPU-only: the engine is
    # fp32-weights + bf16-autocast on device cpu).
    "torch>=2",
    # decision_format.py is gpt2-BPE token math (PROMPT_LEN budgeting,
    # option-letter token ids) — the main-env tiktoken it was validated on.
    "tiktoken>=0.14",
    # load_model pulls the checkpoints through hf_hub_download.
    "huggingface-hub>=0.34",
    # --- server + protocol (current-major floors, shared with _protocol) ---
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "pydantic>=2.14",
    "runner-protocol",
]

[tool.uv]
required-version = ">=0.13"

[tool.uv.sources]
runner-protocol = { path = "../_protocol", editable = true }
# CPU-only torch builds (Windows PyPI is CPU by default; Linux PyPI is not).
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "pyrefly>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# the package is nanodiff_runner; the vendored subpackage keeps the
# upstream name nanodiff (the checkpoint pickle resolves classes through
# the sys.modules alias engine.py installs) and must ship with it.
packages = ["src/nanodiff_runner"]

[tool.pyrefly]
project-includes = ["src", "tests"]
# the vendored upstream files (BY571/nanoDiff config.py + model.py) are
# third-party code kept verbatim for attribution — their type discipline
# is upstream's, not this island's. Both slash styles: the glob must match
# the platform's separators on Windows.
project-excludes = [
    "src/nanodiff_runner/nanodiff/**",
    "src\\nanodiff_runner\\nanodiff\\**",
]
python-version = "3.13"
# tests import their shared stubs from conftest (pytest puts tests/ on
# sys.path at runtime); teach pyrefly the same import root.
search-path = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads the real typed-decisions checkpoints from the local HF cache (skipped when the blob is not cached; CI never downloads weights)",
]

[tool.ruff]
extend = "../../ruff.toml"
