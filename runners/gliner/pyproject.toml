[project]
name = "gliner-runner"
version = "0.1.0"
description = "Local runner island for the GLiNER lineage: GLiFormer, GLiREL, GLiNER-relex, GLiClass and Laya, all on the transformers 4.57.x CPU stack."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # --- the validated stack (legacy/requirements.txt + overrides.txt) ---
    # PIN: validated on transformers 4.57.6. GLiClass 0.1.20 declares
    # transformers>=5 but its v3 checkpoints work on 4.57.6 — the override
    # below keeps that exact release (legacy/overrides.txt).
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    # torch: no explicit line in legacy/requirements.txt; the main venv
    # resolved and validated 2.14.0 (Windows PyPI default = CPU build; the
    # explicit CPU index below keeps Linux/docker images off the CUDA wheels).
    "torch==2.14.0",
    # gliner is the classic package that loads the relex checkpoint; 0.2.29
    # is the floor the relex checkpoint (knowledgator/gliner-relex-multi-v1.0,
    # relations=inference) was validated on.
    "gliner>=0.2.29",
    # EXACT: gliformer 0.1.3 added a `datasets` dependency whose resolver
    # picks a datasets/pyarrow pair that cannot even import together
    # (datasets 2.x wants pyarrow<21); 0.1.2 — the version the v0 benches
    # validated — has no datasets dependency at all.
    "gliformer==0.1.2",
    "glirel>=1.2.1",
    "gliclass==0.1.20",
    "laya>=0.3.4",
    # gliformer's parse_pdf needs pymupdf, which gliformer itself only pulls
    # in under its pdf/all extras.
    "pymupdf>=1.23",
    # glirel imports loguru at module load but leaves it out of its metadata.
    "loguru>=0.7",
    # glirel declares `datasets` with no floor, which resolves to the ancient
    # 2.14.4 — unimportable against modern pyarrow (PyExtensionType removed).
    # Floor at the major the legacy venv validated (5.0.1 + pyarrow 25).
    "datasets>=5",
    # the gliner2[local] island missed these two in legacy; the DeBERTa
    # tokenizer needs them.
    "protobuf",
    "sentencepiece",
    # server + protocol
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "runner-protocol",
]

[tool.uv]
# See the transformers pin above: GLiClass 0.1.20's >=5 declaration is a
# metadata lie for its v3 checkpoints. Keep tied to that exact release.
override-dependencies = ["transformers==4.57.6"]

[tool.uv.sources]
runner-protocol = { path = "../_protocol", editable = true }
# CPU-only torch builds (Windows PyPI is CPU by default; Linux PyPI is not —
# this keeps the docker image off the multi-GB CUDA wheels).
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "pyrefly>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# NOT "gliner": the PyPI classic-gliner package (the relex checkpoint's
# runtime, imported as `from gliner import GLiNER`) owns that top-level
# name — the island package must not shadow it.
packages = ["src/gliner_runner"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
